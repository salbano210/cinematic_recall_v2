services:
  - type: web
    name: cinematic-recall-v2-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false   # set from Neon in the dashboard (secret)
      - key: JWT_SECRET
        generateValue: true
      - key: TMDB_API_KEY
        sync: false   # set from your v1 key
    healthCheckPath: /

  - type: web
    name: cinematic-recall-v2-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_BACKEND_URL
        sync: false   # set to the api service URL after first deploy
    routes:
      - type: rewrite
        source: /*
        destination: /index.html